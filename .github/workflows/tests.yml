name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
            - name: Debug - what does CI see?
        
      - name: Debug - what does CI see?
        run: |
          git log -1 --oneline
          ls -la tests
          cat pyproject.toml
          cat tests/test_contract.py

      - name: Run tests
        run: pytest -v
        